name: DevActionDashboard
options:
  bundleIdPrefix: com.mertsezer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES

targets:
  DevActionDashboard:
    type: application
    platform: macOS
    sources:
      - path: DevActionDashboard
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mertsezer.DevActionDashboard
        PRODUCT_NAME: DevActionDashboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dev Action Dashboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Mert Sezer. MIT License."
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - DevActionDashboardTests

  DevActionDashboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DevActionDashboardTests
    dependencies:
      - target: DevActionDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mertsezer.DevActionDashboardTests
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DevActionDashboard.app/Contents/MacOS/DevActionDashboard"
        BUNDLE_LOADER: "$(TEST_HOST)"
