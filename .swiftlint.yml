# SwiftLint rules for Dev Action Dashboard

included:
  - DevActionDashboard
  - Tests

excluded:
  - .build
  - DerivedData
  - Scripts

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - overridden_super_call
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - trailing_comma

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 60
  error: 100

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - ok

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2
  function_level: 3

force_cast: error
force_try: error
force_unwrapping: warning

custom_rules:
  no_print:
    name: "No print()"
    regex: '\\bprint\\s*\\('
    message: "Use OSLog instead of print()."
    severity: warning
